[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunt"
version = "0.2.0"
description = "Local, scope-aware bug bounty workflow and reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
bughunt = "bughunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
